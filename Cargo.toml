[workspace]
resolver = "2"
members = ["crates/oclapp-core", "crates/oclapp-cli", "crates/oclapp-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["oClapp Contributors"]
license = "MIT"
repository = "https://github.com/jundot/oclapp"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
